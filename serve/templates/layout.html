<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRNE Solar Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.19/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.19/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="dark" hx-ext="sse" sse-connect="api/snapshot/stream">
    <nav class="left m l">
        <header>
            <nav>
                <i class="large">solar_power</i>
                <h6>SRNE Solar</h6>
            </nav>
        </header>
        <a href="./" {{if eq .Page "dashboard"}}class="active"{{end}}>
            <i>dashboard</i>
            <span>Dashboard</span>
        </a>
        <a href="settings" {{if eq .Page "settings"}}class="active"{{end}}>
            <i>settings</i>
            <span>Settings</span>
        </a>
        <a href="faults" {{if eq .Page "faults"}}class="active"{{end}}>
            <i>warning</i>
            <span>Faults</span>
        </a>
    </nav>

    <main class="responsive max">
        {{template "content" .}}
    </main>
</body>
</html>
