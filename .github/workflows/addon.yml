name: HA Add-on

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Set version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update config.yaml version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${version}/" ha-addon/config.yaml

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Promote Unreleased section
        id: promote
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if grep -q '^## Unreleased$' ha-addon/CHANGELOG.md; then
            # Rename the existing "## Unreleased" header to the new version so any
            # bullets already accumulated during development become this release's notes.
            sed -i "s/^## Unreleased$/## ${VERSION}/" ha-addon/CHANGELOG.md
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')

          if [ -n "$PREV_TAG" ]; then
            git log --oneline "${PREV_TAG}..HEAD" > /tmp/commits.txt
            git diff "${PREV_TAG}..HEAD" --stat > /tmp/diffstat.txt
          else
            git log --oneline > /tmp/commits.txt
            echo "" > /tmp/diffstat.txt
          fi

          if [ "$PROMOTED" = "true" ]; then
            INSTRUCTION="A '## ${VERSION}' section already exists (promoted from an Unreleased section with hand-written notes). Review the commits and only APPEND bullets for changes not already covered. Do not duplicate existing bullets or reword them."
          else
            INSTRUCTION="Add a new '## ${VERSION}' section immediately after the '# Changelog' header."
          fi

          cat <<EOF | claude -p --model claude-sonnet-4-6 --allowedTools Read,Edit || echo "::warning::Failed to generate changelog, skipping"
          Update ha-addon/CHANGELOG.md. ${INSTRUCTION}
          Read /tmp/commits.txt for the commits and /tmp/diffstat.txt for changed files.
          Read ha-addon/CHANGELOG.md first to match the existing style.
          Guidelines:
          - Concise, user-facing bullet points
          - Note breaking changes with **Breaking:**
          - Do not modify any other version sections
          EOF

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version (between ## VERSION and the next ## or EOF)
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## /{/^## ${VERSION}$/d;/^## /d;p}" ha-addon/CHANGELOG.md)
          {
            echo "body<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ha-addon/config.yaml ha-addon/CHANGELOG.md
          git diff --cached --quiet || git commit -m "Release ${GITHUB_REF_NAME}: update add-on version"
          git push origin HEAD:master

      - name: Update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
          - arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/home-assistant/armv7-base:3.20
    steps:
      - uses: actions/checkout@v6

      - name: Use version from tag
        id: version
        run: echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
