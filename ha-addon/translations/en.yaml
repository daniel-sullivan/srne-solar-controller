configuration:
  inverters:
    name: Inverters
    description: List of Solarman wifi dongles to connect to.
  poll_interval:
    name: Poll Interval
    description: How often to read data from inverters, in seconds.
  mqtt_enabled:
    name: Enable MQTT
    description: Publish sensor data via MQTT with Home Assistant auto-discovery.
  mqtt_topic_prefix:
    name: MQTT Topic Prefix
    description: Base topic for MQTT discovery (default: homeassistant).
  mqtt_broker:
    name: MQTT Broker
    description: >-
      Override broker URL (e.g., tcp://192.168.1.100:1883).
      Leave empty to auto-discover from the Mosquitto add-on.
  mqtt_username:
    name: MQTT Username
    description: Override MQTT username. Leave empty to use auto-discovered credentials.
  mqtt_password:
    name: MQTT Password
    description: Override MQTT password. Leave empty to use auto-discovered credentials.
